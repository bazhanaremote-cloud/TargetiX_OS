<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Веб-прошивальщик для устройства</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    /* Стилизация кнопки ESP Web Tools */
    esp-web-install-button button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    esp-web-install-button button:hover {
      background-color: #0056b3;
    }
  </style>
  <!-- Подключение скрипта библиотеки ESP Web Tools -->
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
</head>
<body>

  <div class="card">
    <h1>Прошивка устройства</h1>
    <p>Подключите плату по USB к ПК и нажмите кнопку ниже.</p>
    
    <!-- Компонент прошивки -->
    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Подключить и прошить</button>
      <span slot="unsupported">Ваш браузер не поддерживает Web Serial API. Используйте Chrome или Edge на ПК.</span>
    </esp-web-install-button>
  </div>

</body>
</html>
