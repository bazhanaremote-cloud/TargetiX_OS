<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetiX OS — Прошивка устройства</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }
    .device-img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
      object-fit: cover;
    }
    .version-tag {
      display: inline-block;
      background: #e9ecef;
      color: #495057;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    esp-web-install-button button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    esp-web-install-button button:hover {
      background-color: #0056b3;
    }
  </style>
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
</head>
<body>

  <div class="card">
    <!-- Картинка устройства -->
    <img src="device.png" alt="Фото устройства" class="device-img">

    <h1>TargetiX OS</h1>
    <div class="version-tag">Версия v2.6</div>
    <p>Подключите устройство по USB и нажмите кнопку ниже для установки прошивки.</p>

    <!-- Подключение манифеста -->
    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Подключить и прошить</button>
      <span slot="unsupported">Ваш браузер не поддерживает Web Serial API (используйте Chrome или Edge на ПК).</span>
    </esp-web-install-button>
  </div>

</body>
</html>
